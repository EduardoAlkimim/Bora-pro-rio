# O Supabase grátis pausa o projeto depois de 7 dias sem uso.
# Isto faz uma leitura no banco a cada 3 dias pra ele continuar ligado.
name: Manter o banco acordado
on:
  schedule:
    - cron: "17 12 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ler um lugar do banco
        run: |
          URL=$(grep -o 'https://[a-z0-9]*\.supabase\.co' config.js)
          KEY=$(grep -o 'sb_publishable_[A-Za-z0-9_-]*' config.js)
          curl -fsS "$URL/rest/v1/places?select=id&limit=1" -H "apikey: $KEY"
